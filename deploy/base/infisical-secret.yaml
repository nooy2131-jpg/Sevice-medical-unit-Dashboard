# Replace the project slug before registering the ArgoCD Application. Secret
# values live only in Infisical; this resource creates the namespace Secrets.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: okr-unit-runtime
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ongkharak-medical-unit-i-q20
        envSlug: prod
        secretsPath: /okr-unit/runtime
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: monitoring
  managedSecretReference:
    secretName: okr-unit-runtime
    secretNamespace: okr-unit
    creationPolicy: Owner
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: okr-unit-migration
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: ongkharak-medical-unit-i-q20
        envSlug: prod
        secretsPath: /okr-unit/migration
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: monitoring
  managedSecretReference:
    secretName: okr-unit-migration
    secretNamespace: okr-unit
    creationPolicy: Owner
