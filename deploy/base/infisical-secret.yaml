# Platform placeholder. Bind these paths to the project's Infisical environment
# during GitOps review; no secret values belong in this repository.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: okr-unit-runtime
spec:
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: okr-unit
  secretsScope:
    projectSlug: REPLACE_WITH_INFISICAL_PROJECT
    envSlug: prod
    secretsPath: /okr-unit/runtime
  managedSecretReference:
    secretName: okr-unit-runtime
    secretNamespace: okr-unit
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: okr-unit-migration
spec:
  resyncInterval: 60
  authentication:
    universalAuth:
      credentialsRef:
        secretName: infisical-universal-auth
        secretNamespace: okr-unit
  secretsScope:
    projectSlug: REPLACE_WITH_INFISICAL_PROJECT
    envSlug: prod
    secretsPath: /okr-unit/migration
  managedSecretReference:
    secretName: okr-unit-migration
    secretNamespace: okr-unit
