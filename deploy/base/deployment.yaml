apiVersion: apps/v1
kind: Deployment
metadata:
  name: okr-unit
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: okr-unit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okr-unit
    spec:
      containers:
        - name: app
          image: ghcr.io/nooy2131-jpg/okr-unit@sha256:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 40000
          envFrom:
            - secretRef:
                name: okr-unit-runtime
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 512Mi }
