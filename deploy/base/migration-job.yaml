apiVersion: batch/v1
kind: Job
metadata:
  name: okr-unit-migrate
  namespace: okr-unit
  annotations:
    description: "Run manually after reviewing the image and database compatibility; never part of normal app startup."
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okr-unit-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/pingsunn/okr-unit-migrate:REPLACE_WITH_MIGRATION_DIGEST
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: okr-unit-migration
